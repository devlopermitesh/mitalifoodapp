name: 'CI/CD'

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: 'Lint & test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: '📥 Checkout code'
        uses: actions/checkout@v4

      - name: 'Setup JDK 17'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: '📦 Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '22.9.0'
          cache: 'npm'

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Run ESLint'
        run: npm run lint

      - name: 'Run Prettier'
        run: npm run format

      - name: 'Run tests'
        run: npm run test -- --coverage

      - name: 'Upload Coverage Report'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: 'Discord Failure'
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"embeds\": [{\"title\": \"❌ CI Pipeline Failed\", \"description\": \"Branch: \`${{ github.ref_name }}\`\\nCommit: \`${{ github.sha }}\`\\n[View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\", \"color\": 15158332}]}" \
            "$DISCORD_WEBHOOK"

      - name: '🔔 Discord - Success'
        if: success() && secrets.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"embeds\": [{\"title\": \"✅ CI Passed\", \"description\": \"Branch: \`${{ github.ref_name }}\` - All checks passed!\", \"color\": 3066993}]}" \
            "$DISCORD_WEBHOOK"

  build-android:
    name: 'Build Android APK'
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 30
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'Setup JDK 17'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '22.9.0'
          cache: 'npm'

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Install NDK + accept licenses'
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDKROOT"
          yes | "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.12674087"

      - name: 'Cache Gradle'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 'Build android release'
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: 'Upload APK'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: '🔔 Discord - Build Failed'
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"embeds\": [{\"title\": \"❌ Android Build Failed\", \"description\": \"[Logs Here](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\", \"color\": 15158332}]}" \
            "$DISCORD_WEBHOOK"

  deploy:
    name: 'Deploy to Play Store'
    runs-on: ubuntu-latest
    needs: build-android
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 20
    environment:
      name: production
      url: https://play.google.com/store/apps
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'Setup JDK 17'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '22.9.0'
          cache: 'npm'

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Setup Ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
          working-directory: android

      - name: 'Setup fastlane environment'
        working-directory: android
        run: |
          bundle lock --add-platform x86_64-linux
          bundle lock --add-platform ruby
          bundle install --path vendor/bundle

      - name: '📜 Accept Android SDK Licenses'
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: '🔐 Setup Play Store Credentials'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > android/fastlane/mitalicredential.json
          chmod 600 android/fastlane/mitalicredential.json

      - name: 'Make gradlew executable'
        run: chmod +x android/gradlew

      - name: '🚀 Deploy to Google Play Store'
        working-directory: android
        run: bundle exec fastlane playstore

      - name: '🧹 Cleanup Credentials'
        if: always()
        run: rm -f android/fastlane/mitalicredential.json

      - name: '🔔 Discord - Deploy Failed'
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" -X POST -d @- "$DISCORD_WEBHOOK" <<'EOF'
          {
            "embeds": [
              {
                "title": "❌ Deploy Failed",
                "description": "[Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                "color": 15158332
              }
            ]
          }
          EOF

      - name: '🔔 Discord - Success'
        if: success() && secrets.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" -X POST -d @- "$DISCORD_WEBHOOK" <<'EOF'
          {
            "embeds": [
              {
                "title": "✅ Deployed Successfully",
                "description": "App pushed to Play Store! 🎉",
                "color": 3066993
              }
            ]
          }
          EOF
